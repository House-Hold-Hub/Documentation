openapi: 3.0.3
info:
  title: HouseHoldHub MVP API
  version: 1.0.0
  description: |
    Canonical machine-readable HTTP contract for the HouseHoldHub MVP.

    The browser application and API are deployed under the same origin. Authentication
    uses a server-side Django session selected by an HttpOnly cookie. The root security
    requirement applies to every operation unless an operation explicitly declares
    `security: []`.

    Unsafe requests, including public unsafe requests, are CSRF-protected. Clients first
    obtain a CSRF token from the bootstrap operation and send it in `X-CSRFToken`.

    Household resources are query-scoped. A missing resource and a resource outside the
    caller's household scope both return 404. A caller who can access a resource but may
    not perform the requested action receives 403. Request and domain validation errors
    return 400; duplicate or invalid lifecycle-state transitions return 409. The API does
    not return 422. Concurrent writes use last-write-wins and never return 409 merely
    because another write occurred first.
servers:
  - url: /api/v1
    description: Same-origin API base path
tags:
  - name: Authentication
  - name: Households
  - name: Members
  - name: Invitations
  - name: Tasks
  - name: Shopping
  - name: Expenses
  - name: Inventory
  - name: Dashboard
security:
  - sessionAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        Opaque server-side session identifier. Production cookies are Secure and
        HttpOnly. Session keys rotate at authentication and identity-security
        boundaries. A revoked or disabled session is denied on its next request.
  parameters:
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: true
      description: Token returned by the same-origin CSRF bootstrap operation.
      schema:
        type: string
    HouseholdId:
      name: household_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShoppingItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: expense_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InventoryItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    NoStore:
      description: Authenticated and security-sensitive responses are not shared-cacheable.
      schema:
        type: string
        example: private, no-store
  responses:
    BadRequest:
      description: Malformed request or request/domain validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A valid authenticated session is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller can access the addressed resource but may not perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is outside the caller's household scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate resource or invalid current lifecycle state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Request throttled under the configured security policy.
      headers:
        Retry-After:
          description: When present, seconds until the caller should retry.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - AUTHENTICATION_ERROR
            - AUTHORIZATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
        fields:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
    AcknowledgementResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
    CsrfResponse:
      type: object
      additionalProperties: false
      required:
        - csrf_token
      properties:
        csrf_token:
          type: string
          description: Non-secret CSRF token to echo in the X-CSRFToken header.
    PageMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: |
        ISO 4217 currency code supported by the backend and having a defined numeric
        minor-unit exponent. No currency conversion is performed.
      example: EUR
    EmailDeliverySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - status
        - created_at
        - last_attempt_at
        - provider_accepted_at
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
            - email_verification
            - password_reset
            - household_invitation
        status:
          type: string
          enum:
            - pending
            - provider_accepted
            - failed
            - unknown
          description: |
            provider_accepted means the configured provider accepted the message; it
            does not assert inbox delivery. unknown covers an ambiguous provider result.
        created_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        provider_accepted_at:
          type: string
          format: date-time
          nullable: true
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
        - email_verified
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        email_verified:
          type: boolean
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
        - email_verified
        - google_linked
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        email_verified:
          type: boolean
        google_linked:
          type: boolean
        created_at:
          type: string
          format: date-time
    SignupRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
    SignupResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - email_verification_required
        - delivery
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        email_verification_required:
          type: boolean
          enum: [true]
        delivery:
          $ref: '#/components/schemas/EmailDeliverySummary'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - email_verification_required
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        email_verification_required:
          type: boolean
          description: |
            True for a restricted session that may verify/resend email but cannot
            access household data.
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - verifier
      properties:
        verifier:
          type: string
          format: password
          description: |
            One-time bearer extracted from the frontend URL fragment, removed from
            browser history, and sent only in this request body.
    PrimaryEmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - new_email
      properties:
        new_email:
          type: string
          format: email
    ResendVerificationResponse:
      type: object
      additionalProperties: false
      required:
        - delivery
      properties:
        delivery:
          $ref: '#/components/schemas/EmailDeliverySummary'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - verifier
        - new_password
      properties:
        verifier:
          type: string
          format: password
          description: One-time reset bearer supplied in the request body, never a path/query value.
        new_password:
          type: string
          format: password
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    OAuthLinkStartResponse:
      type: object
      additionalProperties: false
      required:
        - authorization_url
      properties:
        authorization_url:
          type: string
          format: uri
    HouseholdSummary:
      type: object
      required:
        - id
        - name
        - description
        - owner_id
        - currency_code
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        owner_id:
          type: string
          format: uuid
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
    HouseholdResponse:
      allOf:
        - $ref: '#/components/schemas/HouseholdSummary'
        - type: object
          required:
            - created_at
            - updated_at
          properties:
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    HouseholdCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - currency_code
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
    HouseholdUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      description: currency_code is immutable in the MVP and cannot be updated.
    HouseholdListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HouseholdSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    HouseholdCodeResponse:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          description: Current globally unique eight-character join code. Never place it in logs or URLs.
    HouseholdJoinRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9]{8}$'
    MembershipSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - user_name
        - role
        - joined_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        role:
          type: string
          enum:
            - owner
            - member
        joined_at:
          type: string
          format: date-time
    MembershipListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
    InvitationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    InvitationOwnerResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - household_id
        - email
        - state
        - created_at
        - expires_at
        - accepted_at
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        state:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: |
            Exactly 30 days after the current issuance or resend, unless the
            invitation is accepted, revoked, rotated, or otherwise invalidated earlier.
        accepted_at:
          type: string
          format: date-time
          nullable: true
    InvitationDeliveryResponse:
      type: object
      additionalProperties: false
      required:
        - invitation
        - delivery
      properties:
        invitation:
          $ref: '#/components/schemas/InvitationOwnerResponse'
        delivery:
          $ref: '#/components/schemas/EmailDeliverySummary'
    InvitationListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvitationOwnerResponse'
    InvitationExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - verifier
      properties:
        verifier:
          type: string
          format: password
          description: |
            High-entropy bearer extracted from the frontend URI fragment. It must
            never be persisted by the browser or sent in a path/query value.
    InvitationPreviewResponse:
      type: object
      additionalProperties: false
      required:
        - invitation_id
        - household
        - invited_email
        - expires_at
      properties:
        invitation_id:
          type: string
          format: uuid
        household:
          $ref: '#/components/schemas/HouseholdSummary'
        invited_email:
          type: string
          format: email
        expires_at:
          type: string
          format: date-time
    InvitationAcceptResponse:
      type: object
      additionalProperties: false
      required:
        - household
        - membership
      properties:
        household:
          $ref: '#/components/schemas/HouseholdSummary'
        membership:
          $ref: '#/components/schemas/MembershipSummary'
    TaskSummary:
      type: object
      required:
        - id
        - household_id
        - title
        - due_date
        - assigned_to_membership_id
        - assigned_to_name
        - completed
        - completed_by_id
        - completed_at
        - created_by_id
        - created_by_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        title:
          type: string
        due_date:
          type: string
          format: date
          nullable: true
        assigned_to_membership_id:
          type: string
          format: uuid
          nullable: true
          description: Current assignee Membership ID; null when unassigned or after assignee removal.
        assigned_to_name:
          type: string
          nullable: true
          description: Current assignee display name; null when unassigned. No former-assignee history is exposed.
        completed:
          type: boolean
        completed_by_id:
          type: string
          format: uuid
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_by_id:
          type: string
          format: uuid
          nullable: true
        created_by_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskResponse:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required:
            - description
          properties:
            description:
              type: string
              nullable: true
    TaskCreateRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        assigned_to_membership_id:
          type: string
          format: uuid
          nullable: true
          description: Must identify an active member of this household.
    TaskUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        assigned_to_membership_id:
          type: string
          format: uuid
          nullable: true
          description: Only the task creator or Household Owner may change this field.
    TaskCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - completed
      properties:
        completed:
          type: boolean
    TaskListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ShoppingItemSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - household_id
        - name
        - quantity
        - purchased
        - purchased_by_id
        - purchased_by_name
        - purchased_at
        - created_by_id
        - created_by_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: string
          nullable: true
        purchased:
          type: boolean
        purchased_by_id:
          type: string
          format: uuid
          nullable: true
        purchased_by_name:
          type: string
          nullable: true
        purchased_at:
          type: string
          format: date-time
          nullable: true
        created_by_id:
          type: string
          format: uuid
          nullable: true
        created_by_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShoppingItemResponse:
      $ref: '#/components/schemas/ShoppingItemSummary'
    ShoppingItemCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        quantity:
          type: string
          nullable: true
    ShoppingItemUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        quantity:
          type: string
          nullable: true
        purchased:
          type: boolean
          description: Backend records or clears purchaser and purchase time with this transition.
    ShoppingItemListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingItemSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    BulkDeleteResponse:
      type: object
      additionalProperties: false
      required:
        - deleted_count
      properties:
        deleted_count:
          type: integer
          minimum: 0
    ExpenseCategory:
      type: string
      enum:
        - Food
        - Utilities
        - Maintenance
        - Entertainment
        - Other
    ExpenseSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - household_id
        - amount_minor
        - currency_code
        - category
        - incurred_on
        - payer_id
        - payer_name
        - description
        - created_by_id
        - created_by_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 1
          description: Positive amount in the ISO 4217 minor units applicable to currency_code.
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        incurred_on:
          type: string
          format: date
          description: Calendar date explicitly supplied by the client at creation.
        payer_id:
          type: string
          format: uuid
          nullable: true
        payer_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_by_id:
          type: string
          format: uuid
          nullable: true
        created_by_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExpenseResponse:
      $ref: '#/components/schemas/ExpenseSummary'
    ExpenseCreateRequest:
      type: object
      additionalProperties: false
      required:
        - amount_minor
        - category
        - incurred_on
      properties:
        amount_minor:
          type: integer
          minimum: 1
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        incurred_on:
          type: string
          format: date
          description: |
            Required client-supplied calendar date. The official frontend defaults
            it from the browser-local date; the backend never derives it from UTC.
        payer_id:
          type: string
          format: uuid
          nullable: true
          description: Active household member; omitted or null defaults to the creator.
        description:
          type: string
          nullable: true
      description: |
        currency_code is not client-settable. The backend copies the household's
        immutable currency code into the expense snapshot.
    ExpenseUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        amount_minor:
          type: integer
          minimum: 1
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        incurred_on:
          type: string
          format: date
        description:
          type: string
          nullable: true
      description: payer_id and currency fields are immutable and cannot be updated.
    ExpenseCategoryTotals:
      type: object
      additionalProperties: false
      required:
        - Food
        - Utilities
        - Maintenance
        - Entertainment
        - Other
      properties:
        Food:
          type: integer
          minimum: 0
        Utilities:
          type: integer
          minimum: 0
        Maintenance:
          type: integer
          minimum: 0
        Entertainment:
          type: integer
          minimum: 0
        Other:
          type: integer
          minimum: 0
    ExpenseListMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - total_amount_minor
        - currency_code
        - by_category
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_amount_minor:
          type: integer
          minimum: 0
          description: Sum across all expenses matching the current filters, not only this page.
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        by_category:
          $ref: '#/components/schemas/ExpenseCategoryTotals'
    ExpenseListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSummary'
        meta:
          $ref: '#/components/schemas/ExpenseListMeta'
    InventoryItemSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - household_id
        - name
        - quantity
        - unit
        - category
        - location
        - created_by_id
        - created_by_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        created_by_id:
          type: string
          format: uuid
          nullable: true
        created_by_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InventoryItemResponse:
      $ref: '#/components/schemas/InventoryItemSummary'
    InventoryItemCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - quantity
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
    InventoryItemUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
    InventoryItemListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DashboardResponse:
      type: object
      additionalProperties: false
      required:
        - as_of
        - household
        - member_count
        - members
        - pending_task_count
        - due_tasks
        - shopping_pending_count
      properties:
        as_of:
          type: string
          format: date
        household:
          $ref: '#/components/schemas/HouseholdSummary'
        member_count:
          type: integer
          minimum: 1
        members:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
        pending_task_count:
          type: integer
          minimum: 0
          description: Count of every incomplete task, including tasks without a due date.
        due_tasks:
          type: array
          maxItems: 3
          description: |
            At most three incomplete dated tasks. Eligible tasks are overdue
            (due_date < as_of), due today, or upcoming through as_of + 7 days
            inclusive. Undated tasks are excluded. Ordering is due_date ascending,
            then created_at ascending, then id ascending.
          items:
            $ref: '#/components/schemas/TaskSummary'
        shopping_pending_count:
          type: integer
          minimum: 0
paths:
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Bootstrap same-origin CSRF protection
      description: |
        Creates or refreshes the CSRF cookie and returns a token for the
        X-CSRFToken header. The response must not be cached.
      security: []
      responses:
        '200':
          description: CSRF token issued.
          headers:
            Set-Cookie:
              description: Same-origin CSRF cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /auth/signup:
    post:
      tags: [Authentication]
      operationId: signup
      summary: Create an email/password account
      description: |
        Creates a UUID user, a restricted pre-verification session, and a durable
        email-verification delivery record. Email sending is attempted synchronously
        after commit; the account remains created if delivery fails. The session key
        rotates while preserving a same-browser pending invitation intent.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created; email verification is required before household access.
          headers:
            Set-Cookie:
              description: Restricted server-side session cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with email and password
      description: |
        Rotates the session key. A valid but unverified account receives a restricted
        session and email_verification_required=true; that session cannot access
        household data. Same-browser pending invitation intent is preserved.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established.
          headers:
            Set-Cookie:
              description: Rotated server-side session cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: Flushes the current session, including any pending invitation intent.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Current session revoked.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the current session user
      responses:
        '200':
          description: Current user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/email/verify:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an initial account email with a one-time bearer
      description: |
        The frontend reads the bearer from a URI fragment, immediately removes the
        fragment from browser history, and sends the bearer only in this body. This
        public operation accepts only initial-account verification bearers. Success
        marks the account email verified. If the same browser already has the matching
        restricted pre-verification session, the backend may upgrade and rotate that
        existing session, preserving its valid pending invitation intent. Otherwise the
        bearer does not create or authenticate a session and the user must log in normally.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '204':
          description: Initial account email verified without treating the bearer as a login credential.
          headers:
            Set-Cookie:
              description: |
                Rotated authenticated session cookie only when a matching restricted
                same-browser session was already present and upgraded.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/email/resend-verification:
    post:
      tags: [Authentication]
      operationId: resendEmailVerification
      summary: Resend verification for the current unverified account
      description: |
        Creates a durable delivery attempt and synchronously attempts sending after
        commit. The response reports delivery state without rolling back account state.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Verification delivery recorded and attempted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email is already verified or a lifecycle transition conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/email/change:
    post:
      tags: [Authentication]
      operationId: requestPrimaryEmailChange
      summary: Start a verified primary-email change
      description: |
        Requires a recently reauthenticated current session, with the exact recency
        window supplied by security configuration. Creates a pending change and durable
        verification-delivery record for new_email, then synchronously attempts provider
        submission after commit. The current primary address remains in effect until the
        new address completes the authenticated primary-email verification operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryEmailChangeRequest'
      responses:
        '202':
          description: Pending primary-email change created and delivery attempted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recent reauthentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The address is current, already used, or incompatible with the account state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/email/change/verify:
    post:
      tags: [Authentication]
      operationId: verifyPrimaryEmailChange
      summary: Verify and establish a pending primary-email change
      description: |
        Requires the same recently reauthenticated current session used for the pending
        primary-email change, with the exact recency window supplied by security
        configuration. Atomically consumes the pending-change verifier, establishes the
        verified new primary address, rotates the current session, and revokes every
        other session for the user. The bearer cannot independently establish a session
        or log a user in.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '204':
          description: New primary email verified; other sessions revoked and current session rotated.
          headers:
            Set-Cookie:
              description: Rotated current session cookie.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recent reauthentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No compatible pending primary-email change can be completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password-reset email
      description: |
        Always returns the same acknowledgement for syntactically valid input, whether
        or not the account exists. The reset bearer is delivered in a frontend URI
        fragment and is never placed in an API path or query string.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted without disclosing account existence or delivery state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password using a one-time bearer
      description: |
        Validates and consumes the bearer atomically, changes the password, and revokes
        every user session. The user must log in again.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed and all sessions revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the current account password
      description: |
        Verifies the current password, applies the new password, revokes every other
        session for the user, and rotates the current session. A valid same-browser
        pending invitation intent survives the current-session rotation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed, other sessions revoked, and current session rotated.
          headers:
            Set-Cookie:
              description: Rotated current session cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The account has no current password or is in an incompatible identity state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google:
    get:
      tags: [Authentication]
      operationId: startGoogleLogin
      summary: Start Google OAuth login
      description: |
        Browser navigation that establishes a state-bound OAuth attempt. OAuth state is
        mandatory and is validated at callback. The flow must not auto-link a Google
        identity to an existing account merely because email addresses match.
      security: []
      responses:
        '302':
          description: Redirect to Google's authorization endpoint.
          headers:
            Location:
              description: Google authorization URL containing an unpredictable state value.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Session cookie retaining the OAuth state correlation.
              schema:
                type: string
  /auth/google/callback:
    get:
      tags: [Authentication]
      operationId: completeGoogleOAuth
      summary: Complete Google OAuth login or explicit link
      description: |
        Validates code and mandatory state. Login creates or authenticates a Google-backed
        account only when safe. If the provider email belongs to an unlinked existing
        account, the operation returns 409 and requires the authenticated explicit-link
        flow. Successful login/link rotates the session while preserving a valid
        same-browser pending invitation intent; successful link also revokes other
        sessions for the user.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: OAuth completed; session rotated and browser redirected to the frontend.
          headers:
            Location:
              description: Same-origin frontend completion URL without provider credentials.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Rotated authenticated session cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Existing account requires explicit authenticated linking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/link/start:
    post:
      tags: [Authentication]
      operationId: startGoogleLink
      summary: Start explicit Google linking for the current account
      description: |
        Requires a recently reauthenticated current session, with the exact recency
        window supplied by security configuration. Creates a state-bound link attempt
        for that authenticated user. Completion uses the shared callback and must link
        only to the same user.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Link authorization URL created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthLinkStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recent reauthentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Google is already linked or another link state conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/link:
    delete:
      tags: [Authentication]
      operationId: unlinkGoogle
      summary: Remove Google from the current account
      description: |
        Requires a recently reauthenticated current session, with the exact recency
        window supplied by security configuration. Successful unlink revokes all other
        sessions and rotates the current session.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Google link removed; other sessions revoked and current session rotated.
          headers:
            Set-Cookie:
              description: Rotated current session cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recent reauthentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Google is not linked or the account is in an incompatible lifecycle state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households:
    get:
      tags: [Households]
      operationId: listHouseholds
      summary: List households for the verified current user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Household page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Email verification is required before household access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Households]
      operationId: createHousehold
      summary: Create a household
      description: |
        The verified current user becomes Owner. currency_code is required and immutable
        for the MVP. The backend validates its supported ISO minor-unit semantics.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreateRequest'
      responses:
        '201':
          description: Household created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /households/{household_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags: [Households]
      operationId: getHousehold
      summary: Get household details
      responses:
        '200':
          description: Household details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Households]
      operationId: updateHousehold
      summary: Update household settings as Owner
      description: currency_code is immutable and is not accepted by this operation.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdUpdateRequest'
      responses:
        '200':
          description: Household updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Households]
      operationId: deleteHousehold
      summary: Soft-delete a household as Owner
      description: |
        Immediately removes member access while preserving household data for the
        approved 30-day support/admin recovery window. No self-service recovery
        operation is exposed by the MVP API.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Household soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/code:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags: [Households]
      operationId: getHouseholdCode
      summary: Get the current household join code as Owner
      responses:
        '200':
          description: Current join code.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/code/regenerate:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      tags: [Households]
      operationId: regenerateHouseholdCode
      summary: Regenerate the join code as Owner
      description: Atomically invalidates the previous code.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: New join code.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdCodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/join:
    post:
      tags: [Members]
      operationId: joinHouseholdByCode
      summary: Join a household using its current code
      description: |
        The verified authenticated user supplies the code in the request body. Codes are
        never accepted in paths/query strings and are not logged.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdJoinRequest'
      responses:
        '200':
          description: Household joined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invalid or inactive code; household existence is not disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is already a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/members:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags: [Members]
      operationId: listHouseholdMembers
      summary: List active household members
      responses:
        '200':
          description: Active memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{household_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Members]
      operationId: removeHouseholdMember
      summary: Remove a member as Owner
      description: |
        Access is denied on the removed user's next request. Their content remains.
        Tasks currently assigned to them become unassigned and expose null current
        assignee fields; the MVP exposes no former-assignee history.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Membership removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The target membership cannot be removed in its current owner/state relationship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /households/{household_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags: [Invitations]
      operationId: listHouseholdInvitations
      summary: List invitations as Owner
      responses:
        '200':
          description: Invitations visible to the Owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Invitations]
      operationId: createHouseholdInvitation
      summary: Invite a member by email as Owner
      description: |
        Creates an invitation and durable email-delivery record in one transaction.
        Email sending is attempted synchronously after commit. Delivery failure does not
        roll back the invitation and is reported by delivery.status. The raw verifier is
        sent only in the email's frontend URI fragment and is never returned here.
        expires_at is set 30 days after issuance and is not client-settable; revoke,
        resend, or acceptance may make the invitation unusable earlier.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
      responses:
        '201':
          description: Invitation created and delivery attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDeliveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Target is already a member or has a conflicting active invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /households/{household_id}/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/InvitationId'
    delete:
      tags: [Invitations]
      operationId: revokeHouseholdInvitation
      summary: Revoke an invitation by ID as Owner
      description: |
        Revocation invalidates the invitation and every session-bound pending intent.
        Any verifier rotation or reissue likewise changes the server-side generation so
        an intent exchanged under an older generation cannot be accepted.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Invitation revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /households/{household_id}/invitations/{invitation_id}/resend:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Invitations]
      operationId: resendHouseholdInvitation
      summary: Rotate and resend a pending invitation as Owner
      description: |
        Atomically rotates the single-use verifier generation, invalidates every stale
        session intent, retains the recoverable invitation record, resets expires_at to
        30 days after reissuance, creates a durable delivery record, and synchronously
        attempts provider submission after commit.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Invitation verifier rotated and delivery attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDeliveryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invitation is not in a resendable pending state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/exchange:
    post:
      tags: [Invitations]
      operationId: exchangeInvitationVerifier
      summary: Exchange a fragment bearer for a session-bound pending intent
      description: |
        The frontend reads the high-entropy verifier from the URI fragment, removes it
        immediately, and sends it only in this body. The backend hashes and validates the
        current verifier and atomically redeems that verifier for exchange, so a second
        exchange attempt with it fails. The Invitation itself remains pending for later
        explicit acceptance. The backend stores only a non-secret invitation ID and
        verifier generation in the server-side session. This operation discloses no
        household preview. The intent remains local to this browser session and is not
        copied to the user's global account.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationExchangeRequest'
      responses:
        '204':
          description: Generation-bound pending intent stored in the current browser session.
          headers:
            Set-Cookie:
              description: Anonymous or rotated server-side session cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Verifier is invalid, expired, rotated, or otherwise unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invitations/pending:
    get:
      tags: [Invitations]
      operationId: previewPendingInvitation
      summary: Preview the current session's pending invitation
      description: |
        Returns a safe preview only when the authenticated user's normalized email is
        verified and exactly matches the invitation email. State, expiry, household,
        nonmembership, and stored verifier generation are revalidated.
      responses:
        '200':
          description: Safe invitation preview.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No authorized usable intent exists, including absent, stale, unverified, or wrong-email state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/pending/accept:
    post:
      tags: [Invitations]
      operationId: acceptPendingInvitation
      summary: Accept the current session's pending invitation
      description: |
        In one atomic operation, revalidates the session-bound ID and verifier generation,
        pending state, expiry, active household, absence of duplicate membership, and the
        authenticated verified normalized-email match; then creates membership, consumes
        the invitation, and clears the pending intent.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Invitation accepted atomically.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No authorized usable intent exists, including absent, stale, unverified, or wrong-email state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Membership already exists after a valid matched intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
